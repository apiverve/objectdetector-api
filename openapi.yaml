openapi: 3.0.4
info:
  title: Object Detector
  description: >-
    Object Detector finds the objects in an image, from people, cars and traffic
    lights to dogs, laptops and cups, and returns each one's label, a numeric
    confidence and its bounding box in pixels and as fractions of the image,
    plus a count per label. Filter by minimum confidence or by the labels you
    care about.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/objectdetector:
    post:
      summary: Object Detector
      description: >-
        Detect objects in an uploaded image, or an image URL, with labels,
        confidence, boxes and counts
      operationId: objectdetector
      parameters:
        - name: minConfidence
          in: query
          schema:
            type: number
          required: false
          description: Lowest confidence to return, from 0.05 to 1
          example: 0.5
        - name: labels
          in: query
          schema:
            type: string
          required: false
          description: >-
            Comma-separated object labels to keep, such as person,car,dog; all
            80 labels when omitted
          example: person,car
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  imageWidth: 640
                  imageHeight: 480
                  objectCount: 5
                  counts:
                    cat: 2
                    remote: 2
                    couch: 1
                  objects:
                    - label: cat
                      confidence: 0.999
                      box:
                        x: 4
                        'y': 51
                        width: 320
                        height: 417
                      normalizedBox:
                        x: 0.0063
                        'y': 0.1062
                        width: 0.5
                        height: 0.8688
                    - label: cat
                      confidence: 0.9987
                      box:
                        x: 331
                        'y': 20
                        width: 309
                        height: 350
                      normalizedBox:
                        x: 0.5172
                        'y': 0.0417
                        width: 0.4828
                        height: 0.7292
                    - label: remote
                      confidence: 0.9984
                      box:
                        x: 329
                        'y': 67
                        width: 42
                        height: 128
                      normalizedBox:
                        x: 0.5141
                        'y': 0.1396
                        width: 0.0656
                        height: 0.2667
                    - label: remote
                      confidence: 0.9975
                      box:
                        x: 29
                        'y': 68
                        width: 160
                        height: 50
                      normalizedBox:
                        x: 0.0453
                        'y': 0.1417
                        width: 0.25
                        height: 0.1042
                    - label: couch
                      confidence: 0.9961
                      box:
                        x: 0
                        'y': 0
                        width: 636
                        height: 472
                      normalizedBox:
                        x: 0
                        'y': 0
                        width: 0.9938
                        height: 0.9833
                  minConfidence: 0.5
                  labels: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: >-
                    File to upload (accepted: .jpg, .jpeg, .png, .gif, .webp,
                    max 10MB)
                  x-acceptedTypes:
                    - .jpg
                    - .jpeg
                    - .png
                    - .gif
                    - .webp
                  x-maxSizeMB: 10
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  image: http://images.cocodataset.org/val2017/000000039769.jpg
  minConfidence: 0.5
