name: apiverve_objectdetector
description: "Object Detector finds the objects in an image, from people, cars and traffic lights to dogs, laptops and cups, and returns each one's label, a numeric confidence and its bounding box in pixels and as fractions of the image, plus a count per label. Filter by minimum confidence or by the labels you care about."
version: 1.2.6
homepage: https://apiverve.com/marketplace/objectdetector?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/objectdetector-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
